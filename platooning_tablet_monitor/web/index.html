<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Platooning Monitor</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <h1>Platooning Monitor</h1>
          <p id="subtitle">
            Host domain <span id="hostDomain">-</span> ·
            Simulation <span id="simulationDomain">-</span> ·
            Follower <span id="followerDomain">-</span> ·
            <span id="clock">-</span>
          </p>
        </div>
        <div class="status-stack">
          <span id="overall" class="pill neutral">WAIT</span>
          <span id="linkState" class="pill neutral">No Link</span>
        </div>
      </header>

      <section class="metrics">
        <article class="metric">
          <span class="label">Leader Task</span>
          <strong id="leaderTask">-</strong>
          <small id="leaderCargo">cargo -</small>
        </article>
        <article class="metric">
          <span class="label">Platoon Mode</span>
          <strong id="platoonMode">-</strong>
          <small id="followerEnable">enable -</small>
        </article>
        <article class="metric">
          <span class="label">Follower</span>
          <strong id="followerStatus">-</strong>
          <small id="safetyState">safety -</small>
        </article>
        <article class="metric">
          <span class="label">Spacing Error</span>
          <strong id="spacingError">-</strong>
          <small id="targetDistance">target -</small>
        </article>
      </section>

      <section class="split">
        <article class="panel">
          <div class="panel-head">
            <h2>Live Spacing</h2>
            <span id="targetVisible" class="pill neutral">Target</span>
          </div>
          <canvas id="spacingChart" width="720" height="260"></canvas>
        </article>

        <article class="panel">
          <div class="panel-head">
            <h2>Motion</h2>
            <span id="activeState" class="pill neutral">Standby</span>
          </div>
          <div class="readout-grid">
            <div>
              <span class="label">Leader Linear</span>
              <strong id="leaderLinear">-</strong>
            </div>
            <div>
              <span class="label">Leader Angular</span>
              <strong id="leaderAngular">-</strong>
            </div>
            <div>
              <span class="label">Leader X</span>
              <strong id="leaderX">-</strong>
            </div>
            <div>
              <span class="label">Leader Yaw</span>
              <strong id="leaderYaw">-</strong>
            </div>
          </div>
        </article>
      </section>

      <section class="health-strip">
        <div id="leaderLink" class="health-cell">Leader</div>
        <div id="followerLink" class="health-cell">Follower</div>
        <div id="spacingState" class="health-cell">Spacing</div>
        <div id="safetyOk" class="health-cell">Safety</div>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
