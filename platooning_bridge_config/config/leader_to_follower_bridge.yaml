name: simulation_to_host_bridge
from_domain: 25
to_domain: 16

topics:
  leader/task_state:
    type: std_msgs/msg/String
    qos:
      reliability: reliable
      durability: transient_local
      depth: 1

  leader/cargo_state:
    type: std_msgs/msg/String
    qos:
      reliability: reliable
      durability: transient_local
      depth: 1

  leader/follower_enable:
    type: std_msgs/msg/Bool
    qos:
      reliability: reliable
      durability: transient_local
      depth: 1

  leader/heartbeat:
    type: std_msgs/msg/Bool
    qos:
      reliability: best_effort
      durability: volatile
      depth: 3

  leader/platoon_mode:
    type: std_msgs/msg/String
    qos:
      reliability: reliable
      durability: transient_local
      depth: 1

  leader/odom:
    type: nav_msgs/msg/Odometry
    qos:
      reliability: best_effort
      durability: volatile
      depth: 5

  leader/cmd_vel:
    type: geometry_msgs/msg/Twist
    qos:
      reliability: best_effort
      durability: volatile
      depth: 5

  leader/battery_state:
    type: sensor_msgs/msg/BatteryState
    from_topic: /battery_state
    to_topic: /leader/battery_state
    qos:
      reliability: best_effort
      durability: volatile
      depth: 5

  mp_control/status:
    type: std_msgs/msg/String
    qos:
      reliability: reliable
      durability: transient_local
      depth: 10

  mp_control/pick_place_status:
    type: std_msgs/msg/String
    qos:
      reliability: best_effort
      durability: volatile
      depth: 10

  cargo/events:
    type: std_msgs/msg/String
    qos:
      reliability: best_effort
      durability: volatile
      depth: 10

  cargo/current_id:
    type: std_msgs/msg/String
    qos:
      reliability: reliable
      durability: transient_local
      depth: 1

  hybrid_csrt_ibvs/debug_image:
    type: sensor_msgs/msg/Image
    qos:
      reliability: best_effort
      durability: volatile
      depth: 2

  camera/color/image_raw:
    type: sensor_msgs/msg/Image
    qos:
      reliability: best_effort
      durability: volatile
      depth: 2

  camera/depth/image_raw:
    type: sensor_msgs/msg/Image
    qos:
      reliability: best_effort
      durability: volatile
      depth: 2

  eef_camera/image_raw:
    type: sensor_msgs/msg/Image
    qos:
      reliability: best_effort
      durability: volatile
      depth: 2
